[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-capstone"
version = "0.1.0"
description = "Meeting follow-through assistant for research teams"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = [
    "pydantic>=2,<3",
]

[project.urls]
Repository = "https://github.com/BryanDYang/guardian-agent"

[project.scripts]
labsync = "labsync.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11"]
audio = [
    "imageio-ffmpeg>=0.6.0",
    "openai-whisper>=20250625",
    "scipy>=1.18.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]
